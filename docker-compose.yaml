services:
  mysql:
    image: mysql:8.4
    container_name: football-game-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: football_data
      MYSQL_USER: football
      MYSQL_PASSWORD: football
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: